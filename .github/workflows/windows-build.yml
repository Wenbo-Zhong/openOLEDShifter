name: Windows build

on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
      - name: Test shared core
        run: dotnet run --project Tests/CoreTests.csproj -c Release
      - name: Build Windows x64
        run: ./build.ps1
      - name: Verify executable and runtime files
        shell: pwsh
        run: |
          foreach ($file in 'OpenOLEDShifter.exe', 'OpenOLEDShifter.dll',
              'OpenOLEDShifter.deps.json', 'OpenOLEDShifter.runtimeconfig.json') {
            if (!(Test-Path -LiteralPath "release/$file" -PathType Leaf)) {
              throw "Missing publish output: $file"
            }
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: OpenOLEDShifter-win-x64
          path: release/
          if-no-files-found: error
