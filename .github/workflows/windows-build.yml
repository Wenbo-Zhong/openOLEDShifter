name: Windows build

on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: wxWidgets/wxWidgets
          ref: 6a42a4b999b127cf28a8b5fe686da6b8ca93a9b8 # v3.3.4
          path: artifacts/wxWidgets
          submodules: recursive
          persist-credentials: false
      - name: Build native Windows x64
        run: ./build.ps1 -WxSource artifacts/wxWidgets
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: OpenOLEDShifter-win-x64
          path: release/windows-x64/
          if-no-files-found: error
